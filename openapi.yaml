openapi: 3.1.0
info:
  title: LEADS Attendance API
  version: 1.0.0
  description: |
    Workforce attendance and task management API for LEADS (aerospace NDT, Singapore),
    consumed by the LEADS Attendance Flutter app.

    **Conventions**
    - Every response uses an envelope. Success: `{ "success": true, "data": … }`.
      Error: `{ "success": false, "error": { "code", "message", "details" } }`.
    - Send `Authorization: Bearer <accessToken>` on every route except signup, login, refresh,
      forgot-password, reset-password and health.
    - Timestamps are ISO-8601 UTC strings without milliseconds (`2026-10-16T00:54:00Z`); fields ending
      in `Utc` are always UTC.
    - Work dates are `YYYY-MM-DD` in the company timezone, `Asia/Singapore`.
    - Durations are integer minutes. IDs are integers.
    - Pagination: `?page=1&pageSize=20` (max 100); responses include `items, page, pageSize, total`.
    - Endpoints that create a resource respond `201`; everything else succeeds with `200`.

    **Real-time (Socket.IO)**: connect to namespace `/admin` with `auth: { token: <accessToken> }`
    (ADMIN or SUPER_ADMIN; other roles get a `connect_error` of `FORBIDDEN`, missing/invalid tokens `UNAUTHORIZED`).
    Server events:
    - `attendance:updated`: one `LiveAttendanceRow`
    - `overview:updated`: an `Overview`
    - `task:updated`: a `TaskSummaryWithAssignee` (with `deleted: true` when the task was deleted)
    - `user:pending`: `{ id, name, email, status: PENDING }` when someone signs up
    - `leave:updated`: a `Leave` whenever one is recorded, requested, approved, rejected, cancelled or withdrawn

    **Roles**
    - `EMPLOYEE`: clocks in and out, works on tasks, reads announcements, requests leave.
    - `ADMIN`: everything under `/admin` for employees: dashboard, tasks, announcements, attendance
      corrections, leave (record, approve, reject, cancel), and employee accounts (create, approve or reject sign-ups, rename, remove, reactivate).
    - `SUPER_ADMIN`: everything an admin can do, plus the only role that may change the office settings
      (`PATCH /admin/office`: name, address, location, geofence radius, default shift start and end, late grace
      minutes, timezone), set anyone's `shiftStart` and `shiftEnd`, and create, promote, demote or remove admins. There is exactly one, created by
      `npm run seed`; it cannot be created, changed or removed through the API by anyone else.
    - When an admin attempts a super-admin-only action the API answers `403 FORBIDDEN`.

    **Accounts**: users are `PENDING` (signed up, awaiting approval), `ACTIVE`, or `INACTIVE` (removed).
    Removing or demoting a user takes effect immediately, including on access tokens already issued.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Attendance
  - name: Tasks
  - name: Files
  - name: Announcements
  - name: Admin

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and database connectivity
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          database: { type: string, const: up }
                          timeUtc: { type: string, format: date-time }
        '503':
          description: Database unreachable (code `SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Rate limited to 5 attempts per 15 minutes per IP + email (`429 RATE_LIMITED`).
        Unknown email and wrong password return the same `INVALID_CREDENTIALS`. Only when the password is right
        does the account state show: `403 ACCOUNT_PENDING` (awaiting approval) or `403 ACCOUNT_INACTIVE` (removed).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: mark.tan@leads-ndt.com }
                password: { type: string, example: 'Welcome123' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [accessToken, refreshToken, user]
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountBlocked' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Employee self sign-up (waits for admin approval)
      description: |
        Creates an `EMPLOYEE` account with status `PENDING`. It cannot log in (`403 ACCOUNT_PENDING`) until an
        admin approves it with `POST /admin/users/{id}/approve`. Admin accounts can never be created here; any
        `role` in the body is ignored. Active admins get a `USER_PENDING` push and a `user:pending` socket event.
        Rate limited to 5 per 15 minutes per IP + email and 20 per hour per IP (`429 RATE_LIMITED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 150, example: Jane Lim }
                email: { type: string, format: email, example: jane.lim@leads-ndt.com }
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: At least one letter and one number.
                  example: 'Welcome123'
      responses:
        '201':
          description: Sign-up received, waiting for approval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [id, name, email, status]
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          email: { type: string }
                          status: { type: string, const: PENDING }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/EmailTaken' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotates the refresh token: the presented one is revoked and a new one issued.
        Presenting an already-rotated or revoked token revokes every refresh token the user holds.
        Expired refresh tokens return `TOKEN_EXPIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenBody' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: |
        Always returns 200 and never reveals whether the email exists. The link is valid for 1 hour and
        is logged to the server console when SMTP isn't configured. Rate limited like login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      description: |
        Single use. Signs the user out of every device. An invalid, used or expired token returns
        `400 VALIDATION_ERROR` with field `token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: At least 8 characters, with at least one letter and one number.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Me
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user profile
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/device-token:
    post:
      tags: [Me]
      operationId: registerDeviceToken
      summary: Register this device for push notifications
      description: Upserts by token; a token previously registered to another account is reassigned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken, platform]
              properties:
                fcmToken: { type: string, minLength: 10, maxLength: 512 }
                platform: { type: string, enum: [android, ios] }
                silent:
                  type: boolean
                  default: false
                  description: >-
                    Deliver this device's notifications without sound (Android channel `leads_silent`, no iOS sound).
                    Send again with the new value when the user changes the setting.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/change-password:
    post:
      tags: [Me]
      operationId: changePassword
      summary: Change your own password
      description: Every refresh token is revoked, so other devices must sign in again (the current access token keeps working until it expires).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  {
                    type: string,
                    minLength: 8,
                    maxLength: 128,
                    description: At least one letter and one number.,
                  }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400':
          description: '`VALIDATION_ERROR`: weak new password, or `currentPassword` is incorrect'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/today:
    get:
      tags: [Me, Attendance]
      operationId: getToday
      summary: Home screen data (EMPLOYEE)
      responses:
        '200':
          description: Today's office, attendance status and task summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [date, office, attendance, tasks]
                        properties:
                          date: { $ref: '#/components/schemas/WorkDate' }
                          office: { $ref: '#/components/schemas/Office' }
                          attendance:
                            type: object
                            required: [status, record]
                            properties:
                              status: { $ref: '#/components/schemas/AttendanceStatus' }
                              record:
                                oneOf:
                                  - $ref: '#/components/schemas/Attendance'
                                  - type: 'null'
                          tasks:
                            type: object
                            required: [total, completed, preview]
                            properties:
                              total: { type: integer }
                              completed: { type: integer }
                              preview:
                                type: array
                                maxItems: 3
                                description: Not-completed tasks first (IN_PROGRESS, then TODO/CARRIED_OVER by due time).
                                items: { $ref: '#/components/schemas/TaskSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Attendance
  /me/leaves:
    get:
      tags: [Me]
      operationId: listMyLeaves
      summary: My leave, newest first (EMPLOYEE)
      responses:
        '200': { $ref: '#/components/responses/LeaveList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Me]
      operationId: requestLeave
      summary: Request leave (EMPLOYEE)
      description: |
        Creates a `PENDING` leave from today onward; it counts once an admin approves it. Active admins get a
        `LEAVE_REQUEST` push and a `leave:updated` socket event. Ranges overlapping pending or approved leave are
        rejected (`400 VALIDATION_ERROR`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDate, toDate, reason]
              properties:
                fromDate: { $ref: '#/components/schemas/WorkDate' }
                toDate: { $ref: '#/components/schemas/WorkDate' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/LeaveCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/leaves/{id}/withdraw:
    post:
      tags: [Me]
      operationId: withdrawLeave
      summary: Withdraw my pending leave, or approved leave that hasn't started (EMPLOYEE)
      description: Sets `CANCELLED`. Approved leave that has started can only be cancelled by an admin.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/LeaveOne' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attendance/clock-in:
    post:
      tags: [Attendance]
      operationId: clockIn
      summary: Clock in from inside the office geofence (EMPLOYEE)
      description: |
        Validated server-side in this order: `MOCK_LOCATION` (isMocked=true), `LOW_ACCURACY`
        (accuracy > MAX_GPS_ACCURACY_METERS), `OUTSIDE_GEOFENCE` (haversine distance to the user's office >
        radius). Only one open shift and one shift per work date are allowed (`ALREADY_CLOCKED_IN`).
        Lateness is computed on the server: late when clock-in is strictly after work date + shift start +
        the office's `lateGraceMinutes` (Singapore time; set by the super admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationFix' }
      responses:
        '201':
          description: Clocked in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Attendance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`ALREADY_CLOCKED_IN`: an open shift exists, or today's shift is already complete"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/LocationRejected' }

  /attendance/current:
    get:
      tags: [Attendance]
      operationId: getCurrentShift
      summary: The open shift, for the Daily Work Report screen (EMPLOYEE)
      responses:
        '200':
          description: Open shift
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [attendance, elapsedMinutes, tasks]
                        properties:
                          attendance: { $ref: '#/components/schemas/Attendance' }
                          elapsedMinutes: { type: integer }
                          tasks:
                            type: array
                            description: Tasks due on the shift's work date.
                            items: { $ref: '#/components/schemas/TaskSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NoOpenShift' }

  /attendance/clock-out:
    post:
      tags: [Attendance]
      operationId: clockOut
      summary: Submit the daily report and clock out (EMPLOYEE)
      description: |
        Atomic: the report insert, task carry-over and shift close commit together or not at all.
        The location is always recorded; `MOCK_LOCATION` and `LOW_ACCURACY` are always enforced, the geofence
        only when `CLOCK_OUT_REQUIRES_GEOFENCE=true`. Each task in `carryOverTaskIds` must belong to the caller
        (`403 FORBIDDEN`) and not be COMPLETED (`400 VALIDATION_ERROR`); it becomes `CARRIED_OVER` and its due
        time moves to the same local time on the next work day (Mon–Fri).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LocationFix'
                - type: object
                  required: [summary]
                  properties:
                    summary: { type: string, minLength: 1, maxLength: 2000 }
                    blockers: { type: [string, 'null'], maxLength: 2000 }
                    notes: { type: [string, 'null'], maxLength: 2000 }
                    carryOverTaskIds:
                      type: array
                      items: { type: integer }
                      default: []
      responses:
        '200':
          description: Clocked out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [attendance, reportId]
                        properties:
                          attendance: { $ref: '#/components/schemas/Attendance' }
                          reportId: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NoOpenShift' }
        '422': { $ref: '#/components/responses/LocationRejected' }

  /attendance/history:
    get:
      tags: [Attendance]
      operationId: getAttendanceHistory
      summary: Monthly attendance history (EMPLOYEE)
      parameters:
        - name: month
          in: query
          description: '`YYYY-MM`; defaults to the current month in Singapore time.'
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-10' }
      responses:
        '200':
          description: History, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [month, stats, days, leaves]
                        properties:
                          month: { type: string, example: '2026-10' }
                          stats:
                            type: object
                            required: [avgMinutes, taskCompletionRate]
                            properties:
                              avgMinutes:
                                type: integer
                                description: Average duration of closed shifts in the month.
                              taskCompletionRate:
                                type: integer
                                minimum: 0
                                maximum: 100
                                description: Completed ÷ total tasks due in the month × 100, rounded.
                          days:
                            type: array
                            items: { $ref: '#/components/schemas/HistoryDay' }
                          leaves:
                            type: array
                            description: Approved leave overlapping the month.
                            items:
                              type: object
                              required: [id, fromDate, toDate, reason]
                              properties:
                                id: { type: integer }
                                fromDate: { $ref: '#/components/schemas/WorkDate' }
                                toDate: { $ref: '#/components/schemas/WorkDate' }
                                reason: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Tasks
  /tasks:
    get:
      tags: [Tasks]
      operationId: listMyTasks
      summary: Own tasks due on a date (EMPLOYEE)
      description: Ordered IN_PROGRESS, then TODO/CARRIED_OVER by due time, then COMPLETED.
      parameters:
        - name: date
          in: query
          description: Defaults to today (Singapore).
          schema: { $ref: '#/components/schemas/WorkDate' }
      responses:
        '200':
          description: Tasks for the date
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [date, completed, total, items]
                        properties:
                          date: { $ref: '#/components/schemas/WorkDate' }
                          completed: { type: integer }
                          total: { type: integer }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/TaskSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Task detail (EMPLOYEE own, or ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/status:
    patch:
      tags: [Tasks]
      operationId: updateTaskStatus
      summary: Advance a task (EMPLOYEE own)
      description: |
        Allowed moves: TODO → IN_PROGRESS, CARRIED_OVER → IN_PROGRESS, IN_PROGRESS → COMPLETED.
        Anything else is `400 VALIDATION_ERROR`. Completing sets `completedUtc`.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
      responses:
        '200': { $ref: '#/components/responses/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/attachments:
    post:
      tags: [Tasks]
      operationId: uploadTaskAttachment
      summary: Upload an inspection report to a task (EMPLOYEE own)
      description: One file in field `file`. pdf, jpg/jpeg, png, docx or xlsx; max MAX_UPLOAD_MB (10 MB). The extension, MIME type and file signature must all agree.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{id}:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download an attachment (task assignee, uploader, or ADMIN)
      parameters:
        - name: id
          in: path
          required: true
          description: Attachment id
          schema: { type: integer }
      responses:
        '200':
          description: The file, with its stored Content-Type
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Announcements
  /announcements:
    get:
      tags: [Announcements]
      operationId: listAnnouncements
      summary: Pinned announcements plus a paginated list of the rest
      parameters:
        - name: category
          in: query
          description: Omit (or leave empty) for all categories.
          schema: { $ref: '#/components/schemas/AnnouncementCategory' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [pinned, items, page, pageSize, total]
                        properties:
                          pinned:
                            type: array
                            items: { $ref: '#/components/schemas/Announcement' }
                          items:
                            type: array
                            description: Excludes pinned announcements.
                            items: { $ref: '#/components/schemas/Announcement' }
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer, description: Total unpinned announcements. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /announcements/{id}:
    get:
      tags: [Announcements]
      operationId: getAnnouncement
      summary: One announcement
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Announcement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin: tasks
  /admin/tasks:
    post:
      tags: [Admin]
      operationId: adminCreateTask
      summary: Create and assign a task
      description: '`dueDate` + `dueTime` are company-timezone local time. The assignee always gets a "New task assigned" push.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, assigneeId, priority, dueDate, dueTime]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 4000, default: '' }
                assigneeId: { type: integer, description: Must be an active EMPLOYEE. }
                priority: { $ref: '#/components/schemas/Priority' }
                dueDate: { $ref: '#/components/schemas/WorkDate' }
                dueTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '17:00' }
                notify:
                  { type: boolean, deprecated: true, description: Ignored; the assignee is always notified. }
      responses:
        '201': { $ref: '#/components/responses/TaskCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Admin]
      operationId: adminListTasks
      summary: All tasks, filtered and paginated
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: assigneeId
          in: query
          schema: { type: integer }
        - name: date
          in: query
          description: Due work date.
          schema: { $ref: '#/components/schemas/WorkDate' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Newest due first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/TaskSummaryWithAssignee' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/tasks/stats:
    get:
      tags: [Admin]
      operationId: adminTaskStats
      summary: Pending vs completed task counts
      responses:
        '200':
          description: pending = TODO + IN_PROGRESS + CARRIED_OVER
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [pending, completed]
                        properties:
                          pending: { type: integer }
                          completed: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/tasks/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateTask
      summary: Update any of the create fields
      description: >-
        Changing only `dueDate` or only `dueTime` keeps the other half. A new assignee always gets a "New task
        assigned" push; for other changes `notify: true` sends the assignee "Task updated".
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                assigneeId: { type: integer }
                priority: { $ref: '#/components/schemas/Priority' }
                dueDate: { $ref: '#/components/schemas/WorkDate' }
                dueTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
                notify: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteTask
      summary: Delete a task and its attachments
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin: announcements
  /admin/announcements:
    post:
      tags: [Admin]
      operationId: adminCreateAnnouncement
      summary: Post an announcement
      description: '`notify: true` pushes to every active user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, category]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 20000 }
                category: { $ref: '#/components/schemas/AnnouncementCategory' }
                isPinned: { type: boolean, default: false }
                notify: { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/announcements/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateAnnouncement
      summary: Partially update an announcement
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, minLength: 1, maxLength: 20000 }
                category: { $ref: '#/components/schemas/AnnouncementCategory' }
                isPinned: { type: boolean }
                notify: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Announcement' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteAnnouncement
      summary: Soft-delete an announcement
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin: dashboard & people
  /admin/overview:
    get:
      tags: [Admin]
      operationId: adminGetOverview
      summary: Today's dashboard figures (Singapore time)
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/live:
    get:
      tags: [Admin]
      operationId: adminGetLiveAttendance
      summary: Live status of every active employee, by name
      responses:
        '200':
          description: Live rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LiveAttendanceRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: Users by status (default ACTIVE, which feeds the assignee dropdown)
      description: '`status=PENDING` lists sign-ups awaiting approval; `status=INACTIVE` lists removed users.'
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: status
          in: query
          schema: { allOf: [{ $ref: '#/components/schemas/UserStatus' }], default: ACTIVE }
      responses:
        '200':
          description: Sorted by name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateUser
      summary: Create an active employee or admin
      description: |
        The account can log in immediately with the password you set; tell the user, and they can change it with
        `POST /me/change-password`. Admins may create `EMPLOYEE` accounts; only the super admin may create `ADMIN`
        accounts or pass `shiftStart` / `shiftEnd` (otherwise `403 FORBIDDEN`). Missing times default to the
        office's; the end must be later than the start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    minLength: 8,
                    maxLength: 128,
                    description: At least one letter and one number.,
                  }
                role: { $ref: '#/components/schemas/AssignableRole' }
                shiftStart:
                  {
                    type: string,
                    pattern: '^([01]\d|2[0-3]):[0-5]\d$',
                    description: Super admin only. Defaults to the office defaultShiftStart.,
                  }
                shiftEnd:
                  {
                    type: string,
                    pattern: '^([01]\d|2[0-3]):[0-5]\d$',
                    description: Super admin only. Defaults to the office defaultShiftEnd.,
                  }
      responses:
        '201': { $ref: '#/components/responses/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/EmailTaken' }

  /admin/users/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Rename, change shift times, or promote/demote
      description: |
        Admins may rename employees (and themselves). Only the super admin may change `role`, `shiftStart` or
        `shiftEnd` (which must stay later than the start), or edit
        an admin account; the super admin account can only be renamed by itself (`403 FORBIDDEN` otherwise).
        Nobody changes their own role (`400 VALIDATION_ERROR`). Role changes apply at once, even to tokens already
        issued, and demoted admins are disconnected from `/admin`.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                role: { $ref: '#/components/schemas/AssignableRole' }
                shiftStart:
                  { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: Super admin only. }
                shiftEnd:
                  { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: Super admin only. }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeactivateUser
      summary: Remove (deactivate) a user
      description: |
        Sets status `INACTIVE`; attendance, tasks and reports are kept. Takes effect immediately: existing access
        tokens stop working, refresh tokens are revoked, push devices are forgotten, and the user drops out of the
        dashboard and assignee lists. Their old tokens get `401 ACCOUNT_INACTIVE` and login returns
        `403 ACCOUNT_INACTIVE`. Admins may remove employees; only the super admin may remove admins; nobody can remove
        the super admin or themselves. Undo with `POST /admin/users/{id}/reactivate` (same permissions).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/approve:
    post:
      tags: [Admin]
      operationId: adminApproveUser
      summary: Approve a pending sign-up
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shiftStart:
                  {
                    type: string,
                    pattern: '^([01]\d|2[0-3]):[0-5]\d$',
                    description: Super admin only. Defaults to the office defaultShiftStart.,
                  }
                shiftEnd:
                  {
                    type: string,
                    pattern: '^([01]\d|2[0-3]):[0-5]\d$',
                    description: Super admin only. Defaults to the office defaultShiftEnd.,
                  }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/reject:
    post:
      tags: [Admin]
      operationId: adminRejectUser
      summary: Reject a pending sign-up
      description: Deletes the sign-up, so the person may register again. Only `PENDING` users can be rejected.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/reactivate:
    post:
      tags: [Admin]
      operationId: adminReactivateUser
      summary: Restore a removed user
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/office:
    get:
      tags: [Admin]
      operationId: adminGetOffice
      summary: Office settings (location, geofence, working time)
      description: Any admin may read them. Only the super admin may change them.
      responses:
        '200': { $ref: '#/components/responses/OfficeSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      operationId: superAdminUpdateOffice
      summary: Change office location, geofence and working time (SUPER_ADMIN only)
      description: |
        Admins and employees get `403 FORBIDDEN`. Send any subset of fields. The new geofence and grace minutes apply
        from the next clock-in; attendance already recorded is not re-evaluated. `defaultShiftStart` and
        `defaultShiftEnd` are given to new users; set `applyShiftToAllUsers: true` to give every existing user the
        office shift as well. The end must be later than the start. A new `timezone`
        applies at once; apps receive it in the user profile (`timezone`) at their next sign-in or launch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 150, example: LEADS Office Geofence }
                address: { type: string, minLength: 1, maxLength: 300 }
                latitude: { type: number, minimum: -90, maximum: 90, example: 1.417 }
                longitude: { type: number, minimum: -180, maximum: 180, example: 103.868 }
                radiusMeters: { type: integer, minimum: 10, maximum: 5000, example: 150 }
                defaultShiftStart: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '09:00' }
                defaultShiftEnd: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '18:00' }
                lateGraceMinutes: { type: integer, minimum: 0, maximum: 240, example: 10 }
                timezone:
                  type: string
                  maxLength: 64
                  example: Asia/Kolkata
                  description: IANA timezone name. Applies at once to "today", lateness and the job schedules.
                applyShiftToAllUsers:
                  type: boolean
                  default: false
                  description: |
                    Requires defaultShiftStart or defaultShiftEnd. Sets every user's shiftStart and shiftEnd to the
                    office defaults (after this update).
      responses:
        '200': { $ref: '#/components/responses/OfficeSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/attendance/manual:
    post:
      tags: [Admin]
      operationId: adminAddManualAttendance
      summary: Add a manual attendance correction
      description: |
        Method `MANUAL`; lateness is recomputed from the user's shift start. `clockInUtc` must fall on
        `workDate` in Singapore time and may not be in the future. Fails with `409 ALREADY_CLOCKED_IN` if the
        user already has a record for that date (or an open shift when `clockOutUtc` is null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, workDate, clockInUtc, reason]
              properties:
                userId: { type: integer }
                workDate: { $ref: '#/components/schemas/WorkDate' }
                clockInUtc: { type: string, format: date-time }
                clockOutUtc: { type: [string, 'null'], format: date-time }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Attendance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`ALREADY_CLOCKED_IN`: overlaps an existing record'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/reports:
    get:
      tags: [Admin]
      operationId: adminListReports
      summary: Daily work reports for a date
      parameters:
        - name: date
          in: query
          description: Defaults to today (Singapore).
          schema: { $ref: '#/components/schemas/WorkDate' }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DailyReport' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/leaves:
    post:
      tags: [Admin]
      operationId: adminCreateLeave
      summary: Record leave for an employee
      description: |
        The leave is `APPROVED` at once and the employee gets a push. Ranges overlapping pending or approved leave
        of the same user are rejected (`400 VALIDATION_ERROR`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, fromDate, toDate, reason]
              properties:
                userId: { type: integer }
                fromDate: { $ref: '#/components/schemas/WorkDate' }
                toDate: { $ref: '#/components/schemas/WorkDate' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/LeaveCreated' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Admin]
      operationId: adminListLeaves
      summary: List leave
      description: |
        With `date`: approved leave covering that day. Otherwise leave in `status` (default `APPROVED`):
        `PENDING` and `APPROVED` list what hasn't ended yet, soonest first; `REJECTED` and `CANCELLED` the latest
        100.
      parameters:
        - name: date
          in: query
          schema: { $ref: '#/components/schemas/WorkDate' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaveStatus' }
      responses:
        '200': { $ref: '#/components/responses/LeaveList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/leaves/{id}/approve:
    post:
      tags: [Admin]
      operationId: adminApproveLeave
      summary: Approve a pending leave request
      description: Only `PENDING` leave. The employee gets a push.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: Shown to the employee. }
      responses:
        '200': { $ref: '#/components/responses/LeaveOne' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/leaves/{id}/reject:
    post:
      tags: [Admin]
      operationId: adminRejectLeave
      summary: Reject a pending leave request
      description: Only `PENDING` leave. The employee gets a push with the note.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: Shown to the employee. }
      responses:
        '200': { $ref: '#/components/responses/LeaveOne' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/leaves/{id}/cancel:
    post:
      tags: [Admin]
      operationId: adminCancelLeave
      summary: Cancel pending or approved leave that hasn't ended
      description: Sets `CANCELLED` (the row is kept). The employee gets a push.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: Shown to the employee. }
      responses:
        '200': { $ref: '#/components/responses/LeaveOne' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from /auth/login or /auth/refresh. Claims: `{ sub, role }`. Lifetime JWT_ACCESS_TTL (15m).'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_CREDENTIALS
                - TOKEN_EXPIRED
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - NO_OPEN_SHIFT
                - ALREADY_CLOCKED_IN
                - OUTSIDE_GEOFENCE
                - LOW_ACCURACY
                - MOCK_LOCATION
                - RATE_LIMITED
                - EMAIL_TAKEN
                - ACCOUNT_PENDING
                - ACCOUNT_INACTIVE
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
            message: { type: string }
            details:
              type: object
              description: |
                VALIDATION_ERROR: `{ fields: [{ field, message }] }`.
                OUTSIDE_GEOFENCE: `{ distanceMeters, radiusMeters }`.
                LOW_ACCURACY: `{ accuracy, maxAccuracy }`. Otherwise usually `{}`.

    WorkDate:
      type: string
      format: date
      description: Calendar date in Asia/Singapore.
      example: '2026-10-16'

    Role: { type: string, enum: [EMPLOYEE, ADMIN, SUPER_ADMIN] }
    AssignableRole:
      type: string
      enum: [EMPLOYEE, ADMIN]
      description: Roles that can be given through the API. `ADMIN` only by the super admin.
    UserStatus: { type: string, enum: [PENDING, ACTIVE, INACTIVE] }
    AttendanceStatus: { type: string, enum: [NOT_CLOCKED_IN, CLOCKED_IN, CLOCKED_OUT] }
    AttendanceMethod: { type: string, enum: [GEOFENCE, MANUAL] }
    LiveStatus: { type: string, enum: [IN_OFFICE, LATE, ON_LEAVE, ABSENT, CLOCKED_OUT] }
    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, COMPLETED, CARRIED_OVER] }
    Priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
    AnnouncementCategory: { type: string, enum: [SAFETY, GENERAL, EVENTS] }

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    RefreshTokenBody:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    PageMeta:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    UserRef:
      type: object
      required: [id, name, initials]
      properties:
        id: { type: integer }
        name: { type: string }
        initials: { type: string, example: MT }

    User:
      type: object
      required: [id, name, email, role, initials, shiftStart, shiftEnd, officeId, timezone]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Mark Tan }
        email: { type: string, format: email, example: mark.tan@leads-ndt.com }
        role: { $ref: '#/components/schemas/Role' }
        initials: { type: string, example: MT }
        shiftStart: { type: string, example: '09:00', description: 'HH:mm, company timezone' }
        shiftEnd:
          { type: string, example: '18:00', description: 'HH:mm, company timezone; later than shiftStart' }
        officeId: { type: integer, example: 1 }
        timezone:
          type: string
          example: Asia/Singapore
          description: The company timezone (IANA name, set by the super admin). Apps show every time in it.

    OfficeSettings:
      type: object
      required:
        [
          id,
          name,
          address,
          latitude,
          longitude,
          radiusMeters,
          defaultShiftStart,
          defaultShiftEnd,
          lateGraceMinutes,
          timezone,
          updatedUtc,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radiusMeters: { type: integer }
        defaultShiftStart: { type: string, example: '09:00' }
        defaultShiftEnd: { type: string, example: '18:00' }
        lateGraceMinutes:
          { type: integer, description: 'Minutes after shiftStart before a clock-in counts as late.' }
        timezone:
          type: string
          example: Asia/Singapore
          description: Company timezone (IANA name) for work dates, lateness, job schedules and displayed times.
        updatedUtc: { type: string, format: date-time }
    AdminUser:
      type: object
      required: [id, name, email, role, initials, status, shiftStart, shiftEnd, createdUtc]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        initials: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        shiftStart: { type: string, example: '09:00' }
        shiftEnd: { type: string, example: '18:00' }
        createdUtc: { type: string, format: date-time }
    Office:
      type: object
      required: [id, name, address, latitude, longitude, radiusMeters]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: LEADS Office Geofence }
        address: { type: string, example: '123 Aerospace Tech Park, Singapore' }
        latitude: { type: number, example: 1.417 }
        longitude: { type: number, example: 103.868 }
        radiusMeters: { type: integer, example: 150 }

    LocationFix:
      type: object
      required: [latitude, longitude, accuracy, isMocked]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, description: Horizontal accuracy in meters. }
        isMocked: { type: boolean }

    Attendance:
      type: object
      required:
        [id, workDate, clockInUtc, clockOutUtc, durationMinutes, method, isLate, clockInDistanceMeters]
      properties:
        id: { type: integer, example: 10 }
        workDate: { $ref: '#/components/schemas/WorkDate' }
        clockInUtc: { type: string, format: date-time }
        clockOutUtc: { type: [string, 'null'], format: date-time }
        durationMinutes:
          { type: [integer, 'null'], description: 'DATEDIFF(MINUTE, in, out); null while open.' }
        method: { $ref: '#/components/schemas/AttendanceMethod' }
        isLate: { type: boolean }
        clockInDistanceMeters:
          type: [integer, 'null']
          description: Server-computed distance from the office at clock-in; null for MANUAL records.
          example: 42

    HistoryDay:
      type: object
      required:
        [workDate, clockInUtc, clockOutUtc, durationMinutes, method, isLate, tasksCompleted, tasksTotal]
      properties:
        workDate: { $ref: '#/components/schemas/WorkDate' }
        clockInUtc: { type: string, format: date-time }
        clockOutUtc: { type: [string, 'null'], format: date-time }
        durationMinutes: { type: [integer, 'null'] }
        method: { $ref: '#/components/schemas/AttendanceMethod' }
        isLate: { type: boolean }
        tasksCompleted: { type: integer }
        tasksTotal: { type: integer }

    TaskSummary:
      type: object
      required: [id, title, priority, status, dueUtc, attachmentCount]
      properties:
        id: { type: integer, example: 5 }
        title: { type: string, example: 'Client follow-up: SIA Engineering' }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        dueUtc: { type: string, format: date-time }
        attachmentCount: { type: integer }

    TaskSummaryWithAssignee:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [assignee]
          properties:
            assignee: { $ref: '#/components/schemas/UserRef' }

    Attachment:
      type: object
      required: [id, fileName, url, uploadedUtc]
      properties:
        id: { type: integer }
        fileName: { type: string, example: report.pdf }
        url:
          type: string
          format: uri
          description: Authenticated download URL (`GET /files/{id}` with the bearer token).
        mimeType: { type: string, example: application/pdf }
        sizeBytes: { type: integer }
        uploadedUtc: { type: string, format: date-time }

    Task:
      allOf:
        - $ref: '#/components/schemas/TaskSummaryWithAssignee'
        - type: object
          required: [description, createdBy, completedUtc, attachments]
          properties:
            description: { type: string }
            createdBy:
              type: object
              required: [id, name]
              properties:
                id: { type: integer }
                name: { type: string, example: Admin }
            completedUtc: { type: [string, 'null'], format: date-time }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }

    Announcement:
      type: object
      required: [id, title, body, category, isPinned, createdUtc, author]
      properties:
        id: { type: integer, example: 3 }
        title: { type: string, example: Safety Briefing Tomorrow }
        body: { type: string }
        category: { $ref: '#/components/schemas/AnnouncementCategory' }
        isPinned: { type: boolean }
        createdUtc: { type: string, format: date-time }
        author:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }

    Overview:
      type: object
      required:
        [
          totalEmployees,
          inOffice,
          inOfficePct,
          clockedOut,
          late,
          onLeave,
          taskCompletionPct,
          taskCompletionDeltaPct,
        ]
      properties:
        totalEmployees: { type: integer, description: Active EMPLOYEE users. }
        inOffice: { type: integer, description: Employees clocked in now (open shifts). }
        inOfficePct: { type: integer, description: inOffice ÷ totalEmployees × 100. }
        clockedOut: { type: integer, description: Employees who clocked in and out today. }
        late:
          type: object
          required: [count, names]
          properties:
            count: { type: integer }
            names: { type: array, items: { type: string } }
        onLeave: { type: integer }
        taskCompletionPct: { type: integer, description: Completed ÷ total tasks due today × 100. }
        taskCompletionDeltaPct:
          type: [integer, 'null']
          description: Today's figure minus yesterday's; null when either day has no tasks due.

    LiveAttendanceRow:
      type: object
      required: [user, status, clockInUtc, clockOutUtc, isLate]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        status:
          allOf: [{ $ref: '#/components/schemas/LiveStatus' }]
          description: CLOCKED_OUT once the shift is closed; LATE or IN_OFFICE while it is open.
        clockInUtc: { type: [string, 'null'], format: date-time }
        clockOutUtc: { type: [string, 'null'], format: date-time }
        isLate: { type: boolean, description: Today's clock-in was late (kept after clock-out). }

    DailyReport:
      type: object
      required: [reportId, user, summary, blockers, notes, submittedUtc, durationMinutes]
      properties:
        reportId: { type: integer }
        user: { $ref: '#/components/schemas/UserRef' }
        summary: { type: string }
        blockers: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        submittedUtc: { type: string, format: date-time }
        durationMinutes: { type: [integer, 'null'] }

    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
      description: Only APPROVED leave counts as "on leave".

    Leave:
      type: object
      required:
        [
          id,
          userId,
          user,
          fromDate,
          toDate,
          days,
          reason,
          status,
          createdUtc,
          createdBy,
          reviewedBy,
          reviewedUtc,
          reviewNote,
        ]
      properties:
        id: { type: integer }
        userId: { type: integer }
        user: { $ref: '#/components/schemas/UserRef' }
        fromDate: { $ref: '#/components/schemas/WorkDate' }
        toDate: { $ref: '#/components/schemas/WorkDate' }
        days: { type: integer, description: Calendar days, both ends included. }
        reason: { type: string }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        createdUtc: { type: string, format: date-time }
        createdBy:
          type: object
          description: The admin who recorded it, or the employee who requested it.
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        reviewedBy:
          type: [object, 'null']
          description: Who approved, rejected, cancelled or withdrew it.
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        reviewedUtc: { type: [string, 'null'], format: date-time }
        reviewNote: { type: [string, 'null'] }

  responses:
    LeaveOne:
      description: The leave
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Leave' }
    LeaveCreated:
      description: Created
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Leave' }
    LeaveList:
      description: Leave
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Leave' }
    Empty:
      description: Success with an empty object
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { type: object, maxProperties: 0 }
    Task:
      description: Task detail
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Task' }
    TaskCreated:
      description: Task created
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Task' }
    Announcement:
      description: Announcement
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/Announcement' }
    ValidationError:
      description: '`VALIDATION_ERROR`: body, query or params failed validation (`details.fields` lists them)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                fields:
                  - { field: email, message: Invalid email }
    OfficeSettings:
      description: The office settings
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/OfficeSettings' }
    AdminUser:
      description: The user
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data: { $ref: '#/components/schemas/AdminUser' }
    EmailTaken:
      description: '`EMAIL_TAKEN`: an account with this email already exists'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AccountBlocked:
      description: '`ACCOUNT_PENDING` (sign-up not yet approved) or `ACCOUNT_INACTIVE` (removed by an admin)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InvalidCredentials:
      description: '`INVALID_CREDENTIALS`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: '`UNAUTHORIZED` (missing/invalid token), `TOKEN_EXPIRED`, or `ACCOUNT_INACTIVE` (the account was removed by an admin after the token was issued; end the session and say so)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: '`FORBIDDEN`: wrong role (including an admin attempting a super-admin-only action), or not the owner of the resource'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NoOpenShift:
      description: '`NO_OPEN_SHIFT`: not clocked in'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: '`RATE_LIMITED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LocationRejected:
      description: '`MOCK_LOCATION`, `LOW_ACCURACY` or `OUTSIDE_GEOFENCE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            outside:
              value:
                success: false
                error:
                  code: OUTSIDE_GEOFENCE
                  message: You are outside the office geofence
                  details: { distanceMeters: 212, radiusMeters: 150 }
            accuracy:
              value:
                success: false
                error:
                  code: LOW_ACCURACY
                  message: GPS accuracy is too low. Move to an open area and try again.
                  details: { accuracy: 80, maxAccuracy: 50 }
