# nginx in front of the PM2-managed API on localhost:4000 (see docs/deploy/linux-pm2.md).
# Copy to /etc/nginx/sites-available/leads-attendance, replace api.example.com, then run certbot for HTTPS.
# Run the API with TRUST_PROXY=1, or every client shares nginx's IP and therefore one login rate limit.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Slightly above MAX_UPLOAD_MB (10 MB) so Node can return a proper validation error.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Socket.IO (/socket.io/) upgrades to WebSocket for the admin live dashboard.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle WebSockets open (Socket.IO pings every 25 s).
        proxy_read_timeout 75s;
    }
}
